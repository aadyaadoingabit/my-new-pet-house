<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Pet House</title>
  <meta name="description" content="A cozy house where you're the pet: habits, focus, fitness, journaling and a calm corner, all in one place.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a href="#home" class="brand">🏠 <span>My Pet House</span></a>

  </header>

  <nav class="rooms" aria-label="Rooms">
    <a href="#home" data-route="home"><span>🚪</span>Front Door</a>
    <a href="#living" data-route="living"><span>🛋️</span>Living Room</a>
    <a href="#study" data-route="study"><span>📚</span>Study</a>

    <a href="#garden" data-route="garden"><span>🌿</span>Calm Garden</a>
    <a href="#bedroom" data-route="bedroom"><span>🛏️</span>Bedroom</a>
    <a href="#attic" data-route="attic"><span>📈</span>Attic</a>
  </nav>

  <main id="app" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>
  <div id="tooltip" role="tooltip"></div>

  <script src="app.js"></script>

</html>
